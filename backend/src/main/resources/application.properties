spring.application.name=aquaflow-backend
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/aquaflow
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=50MB

# Referencias simuladas. Fuera de estos valores el semáforo queda en amarillo.
aquaflow.academico.imc-min=18.5
aquaflow.academico.imc-max=25.0
aquaflow.academico.calbuco-min=80
